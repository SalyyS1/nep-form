log_format nep_form '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name nepform.salyyy.tech;
    server_tokens off;
    access_log /var/log/nginx/nep-form-access.log nep_form;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/nep-form-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://nepform.salyyy.tech$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nepform.salyyy.tech;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/nepform.salyyy.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nepform.salyyy.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/nep-form-access.log nep_form;
    error_log /var/log/nginx/nep-form-error.log;
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

log_format nep_form '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name nepform.salyyy.tech;
    access_log /var/log/nginx/nep-form-access.log nep_form;
    error_log /var/log/nginx/nep-form-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/nep-form-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503 "NẾP FORM đang hoàn tất cấu hình HTTPS. Vui lòng quay lại sau.";
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Retry-After 300 always;
    }
}
